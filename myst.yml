# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 0fa41216-53f0-4115-ac6b-cdbdf6ba1143
  title: Linear Algebra Notes
  github: ds-modules/linear-algebra-notes
  # Enables the in-page "power" button (Binder) so readers can re-run cells live.
  jupyter: true
  toc:
    - file: intro.md
    - title: Chapter 0. Coding Readiness
      children:
        - file: chapters/ch00/index.md
        - file: chapters/ch00/jupyter-python.md
        - file: chapters/ch00/numpy.md
          title: NumPy arrays
        - file: chapters/ch00/matplotlib.md
          title: Simple plots
        - file: chapters/ch00/exercises.md

site:
  template: https://github.com/jupyter-book/myst-theme/releases/download/myst-to-react%401.4.1/book-theme.zip
  actions:
    - title: Open Issue
      url: https://github.com/ds-modules/linear-algebra-notes/issues/new
  options:
    base: /linear-algebra-notes/
    logo: _static/ds.svg
    favicon: _static/favicon.ico
    logo_text: Linear Algebra Notes
    extra_css:
      - _static/custom.css
    navigation_with_keys: true
    show_toc_level: 2
    show_navbar_depth: 2
    use_issues_button: true
    use_repository_button: true
